<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <style>
    @keyframes barGrow {
      0% { transform: scaleY(0); }
      100% { transform: scaleY(1); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .serif { font-family: 'Instrument Serif', 'Newsreader', 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bar { transform-origin: bottom; animation: barGrow 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .fade { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
  </style>

  <!-- Paper Background -->
  <rect x="1" y="1" width="918" height="278" rx="20" fill="#f4f0ea" stroke="#e6e1d8" stroke-width="1.5" />

  <!-- Left: Header & Total -->
  <g transform="translate(42, 42)">
    <text class="mono" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">THE LAST 12 MONTHS ON GITHUB</text>
    <text class="serif" y="44" font-size="44" fill="#18181b">912 <tspan font-style="italic">contributions</tspan></text>
  </g>

  <!-- Monthly Bar Chart -->
  <rect class="bar" x="42" y="202" width="30" height="34" rx="3" fill="#18181b" style="animation-delay: 0.15s; transform-origin: 42px 236px;" />
  <text class="mono" x="57.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Dec</text>
  <rect class="bar" x="84" y="192" width="30" height="44" rx="3" fill="#18181b" style="animation-delay: 0.18s; transform-origin: 84px 236px;" />
  <text class="mono" x="99.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Jan</text>
  <rect class="bar" x="126" y="198" width="30" height="38" rx="3" fill="#18181b" style="animation-delay: 0.21s; transform-origin: 126px 236px;" />
  <text class="mono" x="141.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Feb</text>
  <rect class="bar" x="168" y="136" width="30" height="100" rx="3" fill="#2563eb" style="animation-delay: 0.24s; transform-origin: 168px 236px;" />
  <text class="mono" x="183.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Mar</text>
  <text class="mono fade" x="183.0" y="128" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="700" style="animation-delay: 0.5s;">168</text>
  <rect class="bar" x="210" y="182" width="30" height="54" rx="3" fill="#18181b" style="animation-delay: 0.27s; transform-origin: 210px 236px;" />
  <text class="mono" x="225.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Apr</text>
  <rect class="bar" x="252" y="186" width="30" height="50" rx="3" fill="#18181b" style="animation-delay: 0.3s; transform-origin: 252px 236px;" />
  <text class="mono" x="267.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">May</text>
  <rect class="bar" x="294" y="200" width="30" height="36" rx="3" fill="#18181b" style="animation-delay: 0.33s; transform-origin: 294px 236px;" />
  <text class="mono" x="309.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Jun</text>
  <rect class="bar" x="336" y="204" width="30" height="32" rx="3" fill="#18181b" style="animation-delay: 0.36s; transform-origin: 336px 236px;" />
  <text class="mono" x="351.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Jul</text>
  <rect class="bar" x="378" y="195" width="30" height="41" rx="3" fill="#18181b" style="animation-delay: 0.39s; transform-origin: 378px 236px;" />
  <text class="mono" x="393.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Aug</text>
  <rect class="bar" x="420" y="198" width="30" height="38" rx="3" fill="#18181b" style="animation-delay: 0.42s; transform-origin: 420px 236px;" />
  <text class="mono" x="435.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Sep</text>
  <rect class="bar" x="462" y="184" width="30" height="52" rx="3" fill="#18181b" style="animation-delay: 0.45s; transform-origin: 462px 236px;" />
  <text class="mono" x="477.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Oct</text>
  <rect class="bar" x="504" y="217" width="30" height="19" rx="3" fill="#18181b" style="animation-delay: 0.48s; transform-origin: 504px 236px;" />
  <text class="mono" x="519.0" y="254" text-anchor="middle" fill="#64748b" font-size="11">Nov</text>

  <!-- Vertical Divider -->
  <line x1="600" y1="40" x2="600" y2="240" stroke="#e5e0d8" stroke-width="1.5" />

  <!-- Right Side Stats -->
  <g transform="translate(640, 55)">
    <text class="serif" font-size="34" fill="#18181b">42 <tspan font-style="italic">days</tspan></text>
    <text class="sans" y="24" font-size="12" fill="#64748b">current streak, and the longest</text>
  </g>
  <g transform="translate(640, 130)">
    <text class="serif" font-size="34" fill="#18181b">248 <tspan font-size="24" fill="#64748b">/ 365</tspan></text>
    <text class="sans" y="24" font-size="12" fill="#64748b">days with a commit</text>
  </g>
  <g transform="translate(640, 205)">
    <text class="serif" font-size="34" fill="#18181b">38</text>
    <text class="sans" y="24" font-size="12" fill="#64748b">on the busiest day</text>
  </g>
</svg>