  <text class="mono ascii-row" x="510" y="199.39999999999998" fill="#27272a" font-size="10.2" font-weight="600" xml:space="preserve" style="animation-delay: 0.456s;">.   :::. .::::   .:::-=+***+--===:.---=-:.....</text>
