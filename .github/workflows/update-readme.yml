name: Refresh Animated Profile Cards

on:
  schedule:
    # Run automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''

      - name: Install Fonttools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fonttools brotli Pillow

      - name: Render Animated SVG Cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/render_cards.py

      - name: Commit and Push Updated Cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg data/contributions.json
          if git diff --staged --quiet; then
            echo "No changes in generated SVG cards or data."
          else
            git commit -m "chore(profile): refresh cards and contribution data [skip ci]"
            git push
          fi
